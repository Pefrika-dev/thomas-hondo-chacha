          <text x="18" y="152" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="12" font-weight="700">Suna Motor Bazaar</text>
          <text x="18" y="172" fill="#8f978e" font-family="IBM Plex Mono, Consolas, monospace" font-size="7" letter-spacing="1">VEHICLES · DEMONSTRATION</text>
          <text x="18" y="192" fill="#d9683a" font-family="Manrope, Segoe UI, sans-serif" font-size="8">View case study  →</text>
