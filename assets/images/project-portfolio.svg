<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Thomas Hondo Chacha portfolio interface study</title>
  <desc id="desc">An illustrative view of the bilingual portfolio website with an editorial hero, theme controls and project cards.</desc>
  <defs>
