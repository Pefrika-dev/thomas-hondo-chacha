<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Radio Togotane website concept study</title>
  <desc id="desc">An illustrative community radio website concept with a tuner-inspired dial, programme list and warm on-air identity.</desc>
  <defs>
    <radialGradient id="togo-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e4a957" stop-opacity=".32"/>
      <stop offset=".7" stop-color="#e4a957" stop-opacity=".06"/>
      <stop offset="1" stop-color="#e4a957" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="togo-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1c16"/>
      <stop offset="1" stop-color="#170f0d"/>
    </linearGradient>
    <pattern id="togo-grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".6" fill="#f4e8d8" opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#120d0b"/>
  <circle cx="960" cy="390" r="430" fill="url(#togo-glow)"/>
  <rect x="54" y="46" width="1092" height="808" rx="20" fill="#1a1210" stroke="#f1e7d8" stroke-opacity=".14"/>
  <rect x="54" y="46" width="1092" height="808" rx="20" fill="url(#togo-grain)"/>

  <g transform="translate(86 122)">
    <g>
      <circle cx="15" cy="15" r="14" fill="none" stroke="#e4a957" stroke-width="1.5"/>
      <circle cx="15" cy="15" r="4" fill="#e4a957"/>
      <path d="M15 1v6M15 23v6M1 15h6M23 15h6" stroke="#e4a957" stroke-width="1.2"/>
      <text x="42" y="13" fill="#f1e7d8" font-family="Manrope, Segoe UI, sans-serif" font-size="17" font-weight="800" letter-spacing="3">TOGOTANE</text>
      <text x="42" y="29" fill="#9c8672" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" letter-spacing="2">COMMUNITY RADIO</text>
      <g fill="#b9a792" font-family="Manrope, Segoe UI, sans-serif" font-size="11">
        <text x="742" y="20">Listen</text>
        <text x="812" y="20">Schedule</text>
        <text x="900" y="20">Voices</text>
        <text x="978" y="20">Contact</text>
      </g>
      <rect x="1036" y="-6" width="42" height="42" rx="21" fill="#e4a957"/>
      <path d="M1052 8v18l13-9Z" fill="#1a1210"/>
      <path d="M0 56h1078" stroke="#f1e7d8" stroke-opacity=".12"/>
    </g>

    <g transform="translate(0 94)">
      <text x="0" y="16" fill="#e4a957" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="3">COMMUNITY MEDIA / INTERFACE CONCEPT</text>
      <text x="0" y="96" fill="#f1e7d8" font-family="Georgia, Times New Roman, serif" font-size="70" letter-spacing="-2">Radio, rooted</text>
      <text x="0" y="162" fill="#f1e7d8" font-family="Georgia, Times New Roman, serif" font-size="70" font-style="italic" letter-spacing="-2">in community.</text>
      <text x="0" y="204" fill="#b9a792" font-family="Manrope, Segoe UI, sans-serif" font-size="13">Station identity, programme discovery and listener</text>
      <text x="0" y="224" fill="#b9a792" font-family="Manrope, Segoe UI, sans-serif" font-size="13">connection, gathered into one welcoming place.</text>
      <g transform="translate(0 252)">
        <rect width="118" height="34" rx="17" fill="#e4a957"/>
        <text x="59" y="22" fill="#1a1210" font-family="Manrope, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Listen in</text>
        <rect x="130" y="0" width="128" height="34" rx="17" fill="none" stroke="#f1e7d8" stroke-opacity=".22"/>
        <text x="194" y="22" fill="#d8c8b7" font-family="Manrope, Segoe UI, sans-serif" font-size="10" text-anchor="middle">See schedule</text>
      </g>
    </g>

    <g transform="translate(714 84)">
      <circle cx="164" cy="164" r="158" fill="none" stroke="#f1e7d8" stroke-opacity=".1"/>
      <circle cx="164" cy="164" r="126" fill="none" stroke="#e4a957" stroke-opacity=".28"/>
      <circle cx="164" cy="164" r="90" fill="#241612" stroke="#e4a957" stroke-opacity=".22"/>
      <circle cx="164" cy="164" r="6" fill="#e4a957"/>
      <path d="M164 38v34M164 256v34M38 164h34M256 164h34M75 75l24 24M229 229l24 24M253 75l-24 24M99 229l-24 24" stroke="#e4a957" stroke-opacity=".4"/>
      <g fill="#e4a957">
        <rect x="118" y="136" width="4" height="56" rx="2"/>
        <rect x="130" y="120" width="4" height="88" rx="2" opacity=".8"/>
        <rect x="142" y="146" width="4" height="36" rx="2" opacity=".65"/>
        <rect x="154" y="108" width="4" height="112" rx="2"/>
        <rect x="166" y="128" width="4" height="72" rx="2" opacity=".8"/>
        <rect x="178" y="152" width="4" height="24" rx="2" opacity=".65"/>
        <rect x="190" y="116" width="4" height="96" rx="2"/>
        <rect x="202" y="142" width="4" height="44" rx="2" opacity=".8"/>
      </g>
      <text x="164" y="222" fill="#9c8672" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" letter-spacing="2" text-anchor="middle">CONCEPT PLAYER</text>
      <text x="164" y="340" fill="#9c8672" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" letter-spacing="2" text-anchor="middle">ON-AIR IDENTITY</text>
    </g>

    <g transform="translate(0 424)">
      <path d="M0 0h1078" stroke="#f1e7d8" stroke-opacity=".12"/>
      <text x="0" y="38" fill="#e4a957" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="2.5">PROGRAMME DISCOVERY</text>
      <g transform="translate(0 68)">
        <g>
          <text x="0" y="0" fill="#7f6a59" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="1.5">MORNING</text>
          <text x="0" y="34" fill="#f1e7d8" font-family="Georgia, Times New Roman, serif" font-size="25">The morning programme</text>
          <text x="0" y="56" fill="#a08b77" font-family="Manrope, Segoe UI, sans-serif" font-size="10">Music, local voices and a calm start to the day.</text>
          <path d="M0 78h334" stroke="#f1e7d8" stroke-opacity=".1"/>
        </g>
        <g transform="translate(372 0)">
          <text x="0" y="0" fill="#7f6a59" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="1.5">MIDDAY</text>
          <text x="0" y="34" fill="#f1e7d8" font-family="Georgia, Times New Roman, serif" font-size="25">Community conversation</text>
          <text x="0" y="56" fill="#a08b77" font-family="Manrope, Segoe UI, sans-serif" font-size="10">A space for the people and places around us.</text>
          <path d="M0 78h334" stroke="#f1e7d8" stroke-opacity=".1"/>
        </g>
        <g transform="translate(744 0)">
          <text x="0" y="0" fill="#7f6a59" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="1.5">EVENING</text>
          <text x="0" y="34" fill="#f1e7d8" font-family="Georgia, Times New Roman, serif" font-size="25">The evening session</text>
          <text x="0" y="56" fill="#a08b77" font-family="Manrope, Segoe UI, sans-serif" font-size="10">Stories, music and a slower close to the day.</text>
          <path d="M0 78h334" stroke="#f1e7d8" stroke-opacity=".1"/>
        </g>
      </g>
    </g>

    <g transform="translate(0 604)">
      <rect width="1078" height="112" rx="3" fill="#221613" stroke="#f1e7d8" stroke-opacity=".1"/>
      <text x="28" y="38" fill="#e4a957" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="2">LISTENER PATHWAYS</text>
      <text x="28" y="70" fill="#f1e7d8" font-family="Georgia, Times New Roman, serif" font-size="24" font-style="italic">A station should feel present, not distant.</text>
      <g transform="translate(760 30)">
        <rect width="136" height="28" rx="14" fill="none" stroke="#f1e7d8" stroke-opacity=".18"/>
        <text x="68" y="18" fill="#d8c8b7" font-family="Manrope, Segoe UI, sans-serif" font-size="9" text-anchor="middle">Send a message</text>
        <rect x="148" y="0" width="142" height="28" rx="14" fill="#e4a957"/>
        <text x="219" y="18" fill="#1a1210" font-family="Manrope, Segoe UI, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Join the community</text>
      </g>
    </g>

    <text x="0" y="778" fill="#7f6a59" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="2">RADIO TOGOTANE · WEBSITE CONCEPT / NOT A LIVE BROADCAST</text>
  </g>

  <rect x="950" y="824" width="196" height="22" rx="4" fill="#e4a957"/>
  <text x="1048" y="839" fill="#1a1210" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" letter-spacing="1.5" text-anchor="middle">CONCEPT INTERFACE STUDY</text>
</svg>
