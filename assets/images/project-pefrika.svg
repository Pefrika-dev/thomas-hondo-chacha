<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Pefrika business website interface study</title>
  <desc id="desc">An illustrative business website layout with a clear service structure, a calm green identity and prominent enquiry actions.</desc>
  <defs>
    <linearGradient id="pefrika-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7eee7"/>
      <stop offset="1" stop-color="#cddbd1"/>
    </linearGradient>
    <linearGradient id="pefrika-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17423b"/>
      <stop offset="1" stop-color="#0c2825"/>
    </linearGradient>
    <pattern id="pefrika-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#17423b" opacity=".14"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#dbe4da"/>
  <circle cx="120" cy="800" r="260" fill="#c1d2c2" opacity=".55"/>
  <rect x="54" y="46" width="1092" height="808" rx="20" fill="#f8faf5" stroke="#17423b" stroke-opacity=".18"/>

  <g transform="translate(86 122)">
    <g>
      <rect width="30" height="30" rx="2" fill="#17423b"/>
      <path d="M8 22V8h9a5 5 0 0 1 0 10H8" fill="none" stroke="#eaf1e9" stroke-width="2"/>
      <text x="44" y="23" fill="#12312c" font-family="Manrope, Segoe UI, sans-serif" font-size="21" font-weight="800" letter-spacing="3">PEFRIKA</text>
      <g fill="#536a5f" font-family="Manrope, Segoe UI, sans-serif" font-size="11">
        <text x="690" y="21">Work</text>
        <text x="748" y="21">Approach</text>
        <text x="828" y="21">About</text>
        <text x="892" y="21">Contact</text>
      </g>
      <rect x="982" y="-4" width="96" height="38" rx="19" fill="none" stroke="#17423b" stroke-opacity=".28"/>
      <text x="1030" y="19" fill="#17423b" font-family="Manrope, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Start a project</text>
      <path d="M0 56h1078" stroke="#17423b" stroke-opacity=".16"/>
    </g>

    <g transform="translate(0 104)">
      <rect width="680" height="284" rx="3" fill="url(#pefrika-hero)"/>
      <rect width="680" height="284" rx="3" fill="url(#pefrika-dots)"/>
      <rect x="34" y="30" width="120" height="24" rx="12" fill="#17423b" opacity=".1"/>
      <text x="94" y="46" fill="#17423b" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" letter-spacing="1.5" text-anchor="middle">BUSINESS WEBSITE</text>
      <text x="32" y="122" fill="#12312c" font-family="Georgia, Times New Roman, serif" font-size="52" letter-spacing="-1">Clear work.</text>
      <text x="32" y="177" fill="#12312c" font-family="Georgia, Times New Roman, serif" font-size="52" font-style="italic" letter-spacing="-1">Clear outcomes.</text>
      <text x="34" y="216" fill="#4d6559" font-family="Manrope, Segoe UI, sans-serif" font-size="12">A service-led structure that explains the offer,</text>
      <text x="34" y="236" fill="#4d6559" font-family="Manrope, Segoe UI, sans-serif" font-size="12">supports trust and makes the next step obvious.</text>
      <g transform="translate(34 256)">
        <rect width="114" height="30" rx="15" fill="#17423b"/>
        <text x="57" y="19" fill="#f4f8f2" font-family="Manrope, Segoe UI, sans-serif" font-size="9" text-anchor="middle">Our services</text>
        <text x="130" y="19" fill="#17423b" font-family="Manrope, Segoe UI, sans-serif" font-size="9">Talk to us  →</text>
      </g>
    </g>

    <g transform="translate(706 104)">
      <rect width="372" height="284" rx="3" fill="url(#pefrika-panel)"/>
      <text x="28" y="36" fill="#9fbcae" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="2">THE SHAPE OF THE SITE</text>
      <g transform="translate(28 58)">
        <rect width="316" height="48" rx="2" fill="#f4f8f2" opacity=".94"/>
        <rect x="14" y="14" width="88" height="7" fill="#17423b" opacity=".55"/>
        <rect x="14" y="28" width="160" height="5" fill="#17423b" opacity=".2"/>
        <rect y="62" width="152" height="66" rx="2" fill="#e5ede4" opacity=".92"/>
        <rect x="164" y="62" width="152" height="66" rx="2" fill="#cfe0d1" opacity=".92"/>
        <rect y="142" width="316" height="56" rx="2" fill="none" stroke="#a9c2b3" stroke-opacity=".45"/>
        <rect x="14" y="158" width="72" height="6" fill="#d8e7da" opacity=".8"/>
        <rect x="14" y="172" width="188" height="4" fill="#a9c2b3" opacity=".5"/>
        <circle cx="288" cy="170" r="12" fill="#b6532f"/>
        <path d="M282 170h12M289 165l5 5-5 5" fill="none" stroke="#f4f8f2" stroke-width="1.2"/>
      </g>
    </g>

    <g transform="translate(0 426)">
      <text x="0" y="0" fill="#7a8e80" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="2.5">03 / SERVICE STRUCTURE</text>
      <path d="M0 20h1078" stroke="#17423b" stroke-opacity=".16"/>
      <g transform="translate(0 44)">
        <g>
          <text x="0" y="14" fill="#b6532f" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">01</text>
          <text x="0" y="50" fill="#12312c" font-family="Georgia, Times New Roman, serif" font-size="27">What we do</text>
          <text x="0" y="76" fill="#5b7064" font-family="Manrope, Segoe UI, sans-serif" font-size="11">A concise explanation</text>
          <text x="0" y="94" fill="#5b7064" font-family="Manrope, Segoe UI, sans-serif" font-size="11">of the core offer.</text>
        </g>
        <g transform="translate(368 0)">
          <text x="0" y="14" fill="#b6532f" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">02</text>
          <text x="0" y="50" fill="#12312c" font-family="Georgia, Times New Roman, serif" font-size="27">How we work</text>
          <text x="0" y="76" fill="#5b7064" font-family="Manrope, Segoe UI, sans-serif" font-size="11">A visible process that</text>
          <text x="0" y="94" fill="#5b7064" font-family="Manrope, Segoe UI, sans-serif" font-size="11">reduces uncertainty.</text>
        </g>
        <g transform="translate(736 0)">
          <text x="0" y="14" fill="#b6532f" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">03</text>
          <text x="0" y="50" fill="#12312c" font-family="Georgia, Times New Roman, serif" font-size="27">Get in touch</text>
          <text x="0" y="76" fill="#5b7064" font-family="Manrope, Segoe UI, sans-serif" font-size="11">A direct enquiry path</text>
          <text x="0" y="94" fill="#5b7064" font-family="Manrope, Segoe UI, sans-serif" font-size="11">without unnecessary steps.</text>
        </g>
      </g>
    </g>

    <g transform="translate(0 660)">
      <rect width="1078" height="94" rx="3" fill="#eef3ea" stroke="#17423b" stroke-opacity=".12"/>
      <text x="30" y="38" fill="#12312c" font-family="Georgia, Times New Roman, serif" font-size="24" font-style="italic">A coherent identity, built one decision at a time.</text>
      <text x="30" y="64" fill="#5b7064" font-family="Manrope, Segoe UI, sans-serif" font-size="10">Content hierarchy · service presentation · responsive implementation · enquiry flow</text>
      <rect x="916" y="28" width="132" height="38" rx="19" fill="#17423b"/>
      <text x="982" y="51" fill="#f4f8f2" font-family="Manrope, Segoe UI, sans-serif" font-size="10" text-anchor="middle">Start a conversation</text>
    </g>

    <text x="0" y="794" fill="#7a8e80" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="2">PEFRIKA · BUSINESS WEBSITE / IN DEVELOPMENT</text>
  </g>

  <rect x="950" y="824" width="196" height="22" rx="4" fill="#17423b"/>
  <text x="1048" y="839" fill="#f4f8f2" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" letter-spacing="1.5" text-anchor="middle">ILLUSTRATIVE INTERFACE STUDY</text>
</svg>
