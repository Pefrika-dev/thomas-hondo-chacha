<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Suna Motor Bazaar website interface study</title>
  <desc id="desc">An illustrative vehicle marketplace layout with filter controls, vehicle cards and a clear enquiry path.</desc>
  <defs>
    <linearGradient id="suna-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f28"/>
      <stop offset="1" stop-color="#141714"/>
    </linearGradient>
    <linearGradient id="suna-car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7d2c7"/>
      <stop offset="1" stop-color="#9e988b"/>
    </linearGradient>
    <pattern id="suna-lines" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#f1ede3" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#0d100e"/>
  <rect width="1200" height="900" fill="url(#suna-lines)"/>
  <rect x="54" y="46" width="1092" height="808" rx="18" fill="#141814" stroke="#f1ede3" stroke-opacity=".14"/>

  <g transform="translate(86 118)">
    <g>
      <path d="M0 18 20 0h16v34H0Z" fill="#d9683a"/>
      <text x="52" y="27" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="25" font-weight="800" letter-spacing="4">SUNA</text>
      <text x="164" y="26" fill="#8d938a" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="2.4">MOTOR BAZAAR</text>
      <g fill="#a8aea5" font-family="Manrope, Segoe UI, sans-serif" font-size="11">
        <text x="720" y="25">Stock</text>
        <text x="790" y="25">Compare</text>
        <text x="886" y="25">Sell</text>
        <text x="944" y="25">About</text>
      </g>
      <rect x="1008" y="0" width="70" height="32" rx="16" fill="#d9683a"/>
      <text x="1043" y="21" fill="#151814" font-family="Manrope, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Enquire</text>
      <path d="M0 52h1078" stroke="#f1ede3" stroke-opacity=".12"/>
    </g>

    <g transform="translate(0 92)">
      <text x="0" y="14" fill="#d9683a" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" letter-spacing="3">VEHICLE MARKETPLACE / INTERFACE STUDY</text>
      <text x="0" y="86" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="-2.5">Find the one</text>
      <text x="0" y="154" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="66" font-weight="800" letter-spacing="-2.5">that fits.</text>
      <text x="0" y="194" fill="#9aa198" font-family="Manrope, Segoe UI, sans-serif" font-size="13">A stock-first structure built for scanning,</text>
      <text x="0" y="214" fill="#9aa198" font-family="Manrope, Segoe UI, sans-serif" font-size="13">comparing and starting a conversation.</text>

      <g transform="translate(738 0)">
        <rect width="340" height="214" rx="4" fill="url(#suna-hero)" stroke="#f1ede3" stroke-opacity=".1"/>
        <text x="24" y="34" fill="#7f877e" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="2">MARKETPLACE MODEL</text>
        <g transform="translate(24 58)">
          <circle cx="42" cy="42" r="42" fill="none" stroke="#d9683a" stroke-opacity=".5"/>
          <path d="M24 49h36M20 49l8-14h22l8 14M28 49a6 6 0 1 0 0 .1M62 49a6 6 0 1 0 0 .1" fill="none" stroke="#f1ede3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(136 58)">
          <text x="0" y="14" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="14" font-weight="700">Browse</text>
          <text x="0" y="34" fill="#929a91" font-family="Manrope, Segoe UI, sans-serif" font-size="10">Search and filter</text>
          <text x="0" y="72" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="14" font-weight="700">Compare</text>
          <text x="0" y="92" fill="#929a91" font-family="Manrope, Segoe UI, sans-serif" font-size="10">Specs side by side</text>
        </g>
        <path d="M24 158h292" stroke="#f1ede3" stroke-opacity=".12"/>
        <text x="24" y="190" fill="#d9683a" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="1.5">DISCOVERY → ENQUIRY</text>
      </g>
    </g>

    <g transform="translate(0 352)">
      <rect width="1078" height="54" rx="3" fill="#1b211b" stroke="#f1ede3" stroke-opacity=".1"/>
      <g transform="translate(18 14)">
        <rect width="58" height="26" rx="13" fill="#d9683a"/>
        <text x="29" y="18" fill="#141814" font-family="Manrope, Segoe UI, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ALL</text>
        <g fill="#a9b0a7" font-family="Manrope, Segoe UI, sans-serif" font-size="9">
          <rect x="72" y="0" width="54" height="26" rx="13" fill="none" stroke="#f1ede3" stroke-opacity=".14"/><text x="99" y="18" text-anchor="middle">SUV</text>
          <rect x="138" y="0" width="74" height="26" rx="13" fill="none" stroke="#f1ede3" stroke-opacity=".14"/><text x="175" y="18" text-anchor="middle">SALOON</text>
          <rect x="224" y="0" width="72" height="26" rx="13" fill="none" stroke="#f1ede3" stroke-opacity=".14"/><text x="260" y="18" text-anchor="middle">PICKUP</text>
        </g>
      </g>
      <text x="1060" y="32" fill="#7f877e" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="1.5" text-anchor="end">FILTER CONCEPT / 12 LISTINGS ILLUSTRATIVE</text>
    </g>

    <g transform="translate(0 434)">
      <g>
        <rect width="342" height="294" rx="4" fill="#1b211b" stroke="#f1ede3" stroke-opacity=".11"/>
        <rect x="1" y="1" width="340" height="150" fill="#252c25"/>
        <circle cx="270" cy="44" r="70" fill="#d9683a" opacity=".1"/>
        <g transform="translate(34 74)">
          <path d="M0 42h244M14 42l20-32h56l34 32M42 42a15 15 0 1 0 0 .1M208 42a15 15 0 1 0 0 .1M34 42h174M90 10h28l16 24H74Z" fill="none" stroke="url(#suna-car)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="20" y="180" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="15" font-weight="700">Compact SUV</text>
        <text x="20" y="202" fill="#8f978e" font-family="Manrope, Segoe UI, sans-serif" font-size="10">Automatic · Diesel · 5 seats</text>
        <path d="M20 220h302" stroke="#f1ede3" stroke-opacity=".1"/>
        <text x="20" y="248" fill="#d9683a" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="1">AVAILABILITY ON REQUEST</text>
        <text x="322" y="272" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="10" text-anchor="end">View details  →</text>
      </g>

      <g transform="translate(368 0)">
        <rect width="342" height="294" rx="4" fill="#1b211b" stroke="#f1ede3" stroke-opacity=".11"/>
        <rect x="1" y="1" width="340" height="150" fill="#2a2a23"/>
        <circle cx="70" cy="44" r="70" fill="#c9a25e" opacity=".12"/>
        <g transform="translate(34 76)">
          <path d="M0 40h244M16 40l18-28h62l30 28M44 40a15 15 0 1 0 0 .1M206 40a15 15 0 1 0 0 .1M36 40h168M94 12h32l14 20H80Z" fill="none" stroke="url(#suna-car)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="20" y="180" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="15" font-weight="700">Executive saloon</text>
        <text x="20" y="202" fill="#8f978e" font-family="Manrope, Segoe UI, sans-serif" font-size="10">Automatic · Petrol · 5 seats</text>
        <path d="M20 220h302" stroke="#f1ede3" stroke-opacity=".1"/>
        <text x="20" y="248" fill="#d9683a" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="1">AVAILABILITY ON REQUEST</text>
        <text x="322" y="272" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="10" text-anchor="end">View details  →</text>
      </g>

      <g transform="translate(736 0)">
        <rect width="342" height="294" rx="4" fill="#1b211b" stroke="#f1ede3" stroke-opacity=".11"/>
        <rect x="1" y="1" width="340" height="150" fill="#222a26"/>
        <circle cx="250" cy="42" r="70" fill="#6e8b78" opacity=".14"/>
        <g transform="translate(34 68)">
          <path d="M0 48h244M12 48l20-34h64l32 34M42 48a16 16 0 1 0 0 .1M208 48a16 16 0 1 0 0 .1M34 48h174M98 14h34l14 22H82ZM120 14V6" fill="none" stroke="url(#suna-car)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="20" y="180" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="15" font-weight="700">Double-cab pickup</text>
        <text x="20" y="202" fill="#8f978e" font-family="Manrope, Segoe UI, sans-serif" font-size="10">Manual · Diesel · 5 seats</text>
        <path d="M20 220h302" stroke="#f1ede3" stroke-opacity=".1"/>
        <text x="20" y="248" fill="#d9683a" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="1">AVAILABILITY ON REQUEST</text>
        <text x="322" y="272" fill="#f1ede3" font-family="Manrope, Segoe UI, sans-serif" font-size="10" text-anchor="end">View details  →</text>
      </g>
    </g>

    <g transform="translate(0 758)">
      <path d="M0 0h1078" stroke="#f1ede3" stroke-opacity=".12"/>
      <text x="0" y="28" fill="#7f877e" font-family="IBM Plex Mono, Consolas, monospace" font-size="9" letter-spacing="2">SUNA MOTOR BAZAAR · WEBSITE DEMONSTRATION</text>
      <text x="1078" y="28" fill="#d9683a" font-family="Manrope, Segoe UI, sans-serif" font-size="10" text-anchor="end">Ask about a vehicle  →</text>
    </g>
  </g>

  <rect x="950" y="824" width="196" height="22" rx="4" fill="#d9683a"/>
  <text x="1048" y="839" fill="#141814" font-family="IBM Plex Mono, Consolas, monospace" font-size="8" letter-spacing="1.5" text-anchor="middle">ILLUSTRATIVE INTERFACE STUDY</text>
</svg>
